[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-translator"
version = "2.8.0"
description = "Assistente profissional de comunicação multilíngue integrado ao Windows 10/11"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Eduardo da Silva Arruda"}
]
dependencies = [
    "PySide6>=6.7,<7",
    "httpx>=0.23,<1",
    "pydantic>=1.10,<3",
    "pyperclip>=1.8,<2",
    "pyautogui>=0.9.54,<1",
    "keyboard>=0.13.5,<1",
    "mouse>=0.7.1,<1",
    "keyring>=24.0,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pyinstaller>=6.0,<7",
]

[project.scripts]
universal-translator = "universal_translator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
